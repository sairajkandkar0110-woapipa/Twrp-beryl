    - name: Build Recovery Image
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox
        
        echo "Locating build environment setup script..."
        find . -maxdepth 3 -name "envsetup.sh"
        
        set +e
        export USE_CCACHE=1
        export CCACHE_DIR=$(pwd)/.ccache
        mkdir -p $CCACHE_DIR
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 5G
        
        # Source envsetup from the correct path
        source build/envsetup.sh || . build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE="beryl"
        set -e
        
        lunch twrp_beryl-eng
        make clean
        mka adbd vendorbootimage recoveryimage
