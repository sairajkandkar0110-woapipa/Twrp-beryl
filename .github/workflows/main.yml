name: Extract ROM and Build POCO M7 Pro Device Tree

on:
  workflow_dispatch:
    inputs:
      ROM_URL:
        description: 'Direct Download Link to Stock Fastboot/OTA ROM (.zip)'
        required: true
        type: string
      DEVICE_CODENAME:
        description: 'Device Codename'
        required: true
        default: 'beryl'
        type: string
      OEM_NAME:
        description: 'Manufacturer Name'
        required: true
        default: 'xiaomi'
        type: string

jobs:
  process-rom:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Git Identity
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Download and Extract Stock ROM
        run: |
          mkdir -p ~/rom_workspace
          cd ~/rom_workspace
          
          echo "[*] Downloading stock ROM archive..."
          curl -L "${{ inputs.ROM_URL }}" -o stock_firmware.zip || wget "${{ inputs.ROM_URL }}" -O stock_firmware.zip
          
          echo "[*] Unpacking archive..."
          unzip -q stock_firmware.zip || bsdtar -xf stock_firmware.zip || true
          
          mkdir -p extracted_partitions
          if [ -f payload.bin ] || [ -f */payload.bin ]; then
            PAYLOAD_PATH=$(find . -name "payload.bin" | head -n 1)
            echo "[*] Found payload.bin at: $PAYLOAD_PATH. Extracting partitions..."
            
            curl -s https://api.github.com/repos/ssut/payload-dumper-go/releases/latest \
              | grep browser_download_url | grep linux_amd64 | cut -d '"' -f 4 | wget -qi -
            tar -xzf payload-dumper-go_*_linux_amd64.tar.gz
            
            ./payload-dumper-go -o extracted_partitions "$PAYLOAD_PATH"
          else
            echo "[*] Searching for raw image files..."
            find . -name "*.img" -exec cp {} extracted_partitions/ \;
          fi
          
          ls -la extracted_partitions/

      - name: Generate Device Tree and Inject Extracted Elements
        run: |
          VENDOR="${{ inputs.OEM_NAME }}"
          CODENAME="${{ inputs.DEVICE_CODENAME }}"
          DEVICE_DIR="device/$VENDOR/$CODENAME"

          echo "[*] Creating device tree directory: $DEVICE_DIR"
          mkdir -p "$DEVICE_DIR/prebuilts"

          if [ -f ~/rom_workspace/extracted_partitions/vendor_boot.img ]; then
            cp ~/rom_workspace/extracted_partitions/vendor_boot.img "$DEVICE_DIR/prebuilts/vendor_boot.img"
            echo "[*] Successfully integrated stock vendor_boot.img for crypto HAL mapping."
          fi

          echo "[*] Writing BoardConfig.mk..."
          cat << 'EOF' > "$DEVICE_DIR/BoardConfig.mk"
          LOCAL_PATH := device/xiaomi/beryl

          TARGET_ARCH := arm64
          TARGET_CPU_ABI := arm64-v8a
          TARGET_BOARD_PLATFORM := mt6878
          TARGET_NO_KERNEL := false

          # Vendor Boot & Decryption Configuration
          BOARD_USES_VENDOR_BOOT := true
          BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT := true
          BOARD_INCLUDE_RECOVERY_DTBO_IN_VENDOR_BOOT := true
          BOARD_BOOTIMG_HEADER_VERSION := 4
          BOARD_KERNEL_BASE := 0x00000000
          BOARD_KERNEL_PAGESIZE := 2048
          BOARD_KERNEL_CMDLINE := bootconfig
          
          # Storage & File-Based Encryption (FBE v2)
          BOARD_SUPPORTS_EXT4 := true
          BOARD_SUPPORTS_F2FS := true
          TARGET_USERIMAGES_USE_F2FS := true
          TW_INCLUDE_CRYPTO := true
          TW_INCLUDE_CRYPTO_FBE := true
          TW_USE_FS_CRYPT_H := true
          BOARD_USES_METADATA_PARTITION := true

          # Screen & UI
          TW_THEME := portrait_ds
          TARGET_SCREEN_WIDTH := 1080
          TARGET_SCREEN_HEIGHT := 2400
          EOF

          echo "[*] Writing recovery.fstab..."
          cat << 'EOF' > "$DEVICE_DIR/recovery.fstab"
          /system              erofs     super                                               flags=display="System";logical
          /vendor              erofs     super                                               flags=display="Vendor";logical
          /product             erofs     super                                               flags=display="Product";logical
          /odm                 erofs     super                                               flags=display="ODM";logical

          /boot                emmc      /dev/block/by-name/boot                             flags=display="Boot";backup=1;flashimg=1
          /vendor_boot         emmc      /dev/block/by-name/vendor_boot                      flags=display="Vendor Boot";backup=1;flashimg=1
          /recovery            emmc      /dev/block/by-name/recovery                         flags=display="Recovery";backup=1;flashimg=1
          
          /data                f2fs      /dev/block/by-name/userdata                         flags=display="Data";encryptable=footer;length=-16384
          /cache               ext4      /dev/block/by-name/cache                            flags=display="Cache";backup=1
          /metadata            ext4      /dev/block/by-name/metadata                         flags=display="Metadata";backup=1
          /persist             ext4      /dev/block/by-name/persist                          flags=display="Persist";backup=1;flashimg=1
          EOF

          echo "[*] Writing device.mk..."
          cat << 'EOF' > "$DEVICE_DIR/device.mk"
          LOCAL_PATH := device/xiaomi/beryl
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)

          PRODUCT_PACKAGES += e2fsck fsck.f2fs make_f2fs libext4_utils
          PRODUCT_COPY_FILES += $(LOCAL_PATH)/recovery.fstab:$(TARGET_COPY_OUT_RECOVERY)/root/system/etc/recovery.fstab
          PRODUCT_PROPERTY_OVERRIDES += ro.crypto.allow_missing_encryption_options=true
          EOF

          echo "[*] Writing AndroidProducts.mk..."
          cat << 'EOF' > "$DEVICE_DIR/AndroidProducts.mk"
          PRODUCT_MAKEFILES := $(LOCAL_DIR)/recovery_beryl.mk
          COMMON_AVB_MAKEFILES := $(LOCAL_DIR)/recovery_beryl.mk
          EOF

          echo "[*] Writing recovery_beryl.mk..."
          cat << 'EOF' > "$DEVICE_DIR/recovery_beryl.mk"
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/base_telephony.mk)
          PRODUCT_NAME := recovery_beryl
          PRODUCT_DEVICE := beryl
          PRODUCT_MANUFACTURER := xiaomi
          PRODUCT_BRAND := POCO
          PRODUCT_MODEL := POCO M7 Pro 5G
          EOF

          echo "[*] Writing Android.mk..."
          cat << 'EOF' > "$DEVICE_DIR/Android.mk"
          LOCAL_PATH := $(call my-dir)
          ifeq ($(TARGET_DEVICE),beryl)
          include $(call all-subdir-makefiles under,$(LOCAL_PATH))
          endif
          EOF

          echo "[*] Committing extracted tree and binaries..."
          git add "$DEVICE_DIR"
          git commit -m "device: xiaomi: beryl: Auto-extract ROM partitions and build crypto-ready device tree"
          git push origin HEAD:main || git push origin HEAD:master
          
