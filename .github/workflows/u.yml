    - name: Clone IQ-HARRY7 Tree, Patch Decryption, and Place in Root
      run: |
        echo "Cloning base device tree from IQ-HARRY7 (branch khargosxh)..."
        git clone --branch khargosxh https://github.com/IQ-HARRY7/android_device_xiaomi_beryl_2.git temp_dt
        
        if [ ! -d "temp_dt" ]; then
          echo "Error: Failed to clone repository branch!"
          exit 1
        fi
        
        # Clean current root files except git configs
        find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +
        
        # Copy tree contents directly to repository root
        cp -r temp_dt/* ./
        rm -rf temp_dt
        
        EXTRACTED="rom_extracted/extracted_images"
        mkdir -p prebuilt
        
        # Inject raw hardware binaries
        [ -f "$EXTRACTED/boot.img" ] && cp "$EXTRACTED/boot.img" prebuilt/boot.img
        [ -f "$EXTRACTED/vendor_boot.img" ] && cp "$EXTRACTED/vendor_boot.img" prebuilt/vendor_boot.img
        [ -f "$EXTRACTED/dtbo.img" ] && cp "$EXTRACTED/dtbo.img" prebuilt/dtbo.img
        
        # Extract kernel binary if missing
        if [ ! -f "prebuilt/kernel" ] && [ -f "$EXTRACTED/boot.img" ]; then
          git clone https://github.com/cyberknight777/AIK-Linux.git aik || true
          if [ -d "aik" ]; then
            cp "$EXTRACTED/boot.img" aik/
            cd aik
            ./unpackbootimg.sh boot.img || true
            [ -f "split_img/boot.img-kernel" ] && cp split_img/boot.img-kernel "../prebuilt/kernel"
            cd ..
            rm -rf aik
          fi
        fi

        # Append decryption & FBE configuration flags to BoardConfig.mk
        echo "" >> BoardConfig.mk
        echo "# --- Custom OrangeFox Encryption & Decryption Flags ---" >> BoardConfig.mk
        echo "TW_INCLUDE_CRYPTO := true" >> BoardConfig.mk
        echo "TW_INCLUDE_CRYPTO_FBE := true" >> BoardConfig.mk
        echo "BOARD_USES_METADATA_PARTITION := true" >> BoardConfig.mk
        echo "TW_INCLUDE_XMLPARSER := true" >> BoardConfig.mk
        echo "TW_USE_TOOLBOX := true" >> BoardConfig.mk
