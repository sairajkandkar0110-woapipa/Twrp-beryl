name: Generate Device Tree

on:
  workflow_dispatch:
    inputs:
      ROM_URL:
        description: 'Direct Download URL of the Stock ROM (.zip)'
        required: true
        type: string

jobs:
  build:
    name: Extract and Generate Tree
    runs-on: ubuntu-22.04
    permissions:
      contents: write 
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y aria2 p7zip-full cpio lz4 wget mkbootimg curl
        pip3 install twrpdtgen

    - name: Install payload-dumper-go
      run: |
        wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
        tar -xf payload-dumper-go_1.2.2_linux_amd64.tar.gz
        sudo mv payload-dumper-go /usr/local/bin/
        rm payload-dumper-go_1.2.2_linux_amd64.tar.gz

    - name: Download Stock ROM
      run: |
        echo "Downloading ROM..."
        aria2c -x 16 -s 16 "${{ inputs.ROM_URL }}" -o rom.zip

    - name: Extract payload.bin
      run: |
        echo "Extracting payload.bin from ROM zip..."
        unzip -j rom.zip payload.bin || 7z e rom.zip payload.bin
        rm rom.zip

    - name: Dump Partitions
      run: |
        echo "Dumping boot, init_boot, vendor_boot, dtbo, and vendor..."
        payload-dumper-go -p boot,init_boot,vendor_boot,dtbo,vendor -o extracted payload.bin
        rm payload.bin

    - name: Generate Base Device Tree
      run: |
        echo "Patching sebaubuntu_libs to fix fstab unpacking error..."
        python3 -c "
        import sys, os
        for p in sys.path:
            f = os.path.join(p, 'sebaubuntu_libs', 'libandroid', 'fstab', '__init__.py')
            if os.path.exists(f):
                with open(f, 'r') as r: d = r.read()
                d = d.replace('src, mount_point, fs_type, mnt_flags, fs_flags = line.split()', 'src, mount_point, fs_type, mnt_flags, fs_flags = (line.split() + [\"\", \"\", \"\", \"\"])[:5]')
                with open(f, 'w') as w: w.write(d)
        "
        
        echo "Running twrpdtgen on vendor_boot.img..."
        python3 -m twrpdtgen extracted/vendor_boot.img -o workspace/

    - name: Extract Prebuilts (Kernel & DTBO)
      run: |
        echo "Downloading LineageOS unpack_bootimg.py..."
        curl -sL "https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-21.0/unpack_bootimg.py" -o unpack_bootimg.py
        
        echo "Unpacking boot.img..."
        mkdir -p extracted_boot
        python3 unpack_bootimg.py --boot_img extracted/boot.img --out extracted_boot
        
        TREE_PATH=$(find workspace -mindepth 2 -maxdepth 3 -type d | head -n 1)
        echo "Creating prebuilt directory in $TREE_PATH..."
        mkdir -p $TREE_PATH/prebuilt
        
        echo "Moving kernel and DTBO to device tree..."
        find extracted_boot -type f -name "*kernel*" -exec cp {} $TREE_PATH/prebuilt/kernel \;
        cp extracted/dtbo.img $TREE_PATH/prebuilt/dtbo.img
        
        echo "Ensuring BoardConfig.mk points to the prebuilt kernel and DTBO..."
        # Link Kernel
        if grep -q "TARGET_PREBUILT_KERNEL" $TREE_PATH/BoardConfig.mk; then
          sed -i 's|TARGET_PREBUILT_KERNEL := .*|TARGET_PREBUILT_KERNEL := $(DEVICE_PATH)/prebuilt/kernel|g' $TREE_PATH/BoardConfig.mk
        else
          echo "TARGET_PREBUILT_KERNEL := \$(DEVICE_PATH)/prebuilt/kernel" >> $TREE_PATH/BoardConfig.mk
        fi
        
        # Link DTBO
        if grep -q "BOARD_PREBUILT_DTBOIMAGE" $TREE_PATH/BoardConfig.mk; then
          sed -i 's|BOARD_PREBUILT_DTBOIMAGE := .*|BOARD_PREBUILT_DTBOIMAGE := $(DEVICE_PATH)/prebuilt/dtbo.img|g' $TREE_PATH/BoardConfig.mk
        else
          echo "BOARD_PREBUILT_DTBOIMAGE := \$(DEVICE_PATH)/prebuilt/dtbo.img" >> $TREE_PATH/BoardConfig.mk
          echo "BOARD_INCLUDE_DTB_IN_BOOTIMG := true" >> $TREE_PATH/BoardConfig.mk
        fi

    - name: Mount Vendor & Extract Proprietary Blobs
      run: |
        echo "Mounting EROFS vendor.img..."
        mkdir -p vendor_mnt
        sudo mount -t erofs -o ro,loop extracted/vendor.img vendor_mnt
        
        TREE_PATH=$(find workspace -mindepth 2 -maxdepth 3 -type d | head -n 1)
        
        echo "Creating recovery/root/vendor structure..."
        mkdir -p $TREE_PATH/recovery/root/vendor/bin/hw
        mkdir -p $TREE_PATH/recovery/root/vendor/lib64/hw
        mkdir -p $TREE_PATH/recovery/root/vendor/etc/init
        mkdir -p $TREE_PATH/recovery/root/vendor/lib/modules
        mkdir -p $TREE_PATH/recovery/root/vendor/firmware
        
        echo "Copying Hardware Keystore, Gatekeeper, and TEE Daemons..."
        sudo cp vendor_mnt/bin/hw/android.hardware.security.keymint-service* $TREE_PATH/recovery/root/vendor/bin/hw/ || true
        sudo cp vendor_mnt/bin/hw/android.hardware.gatekeeper@1.0-service* $TREE_PATH/recovery/root/vendor/bin/hw/ || true
        sudo cp vendor_mnt/bin/tee* $TREE_PATH/recovery/root/vendor/bin/ || true
        sudo cp vendor_mnt/bin/mitee* $TREE_PATH/recovery/root/vendor/bin/ || true
        
        echo "Copying Init Scripts and fstabs..."
        sudo cp vendor_mnt/etc/init/android.hardware.security.keymint* $TREE_PATH/recovery/root/vendor/etc/init/ || true
        sudo cp vendor_mnt/etc/init/android.hardware.gatekeeper* $TREE_PATH/recovery/root/vendor/etc/init/ || true
        sudo cp vendor_mnt/etc/init/tee* $TREE_PATH/recovery/root/vendor/etc/init/ || true
        sudo cp vendor_mnt/etc/fstab.* $TREE_PATH/recovery/root/vendor/etc/ || true
        
        echo "Copying Touch Drivers and Firmware..."
        sudo find vendor_mnt/lib/modules -name "*fts_touch*.ko" -exec cp {} $TREE_PATH/recovery/root/vendor/lib/modules/ \; || true
        sudo find vendor_mnt/lib/modules -name "*xiaomi_touch*.ko" -exec cp {} $TREE_PATH/recovery/root/vendor/lib/modules/ \; || true
        sudo cp -r vendor_mnt/firmware/* $TREE_PATH/recovery/root/vendor/firmware/ || true
        
        echo "Fixing permissions on copied files..."
        sudo chown -R $USER:$USER $TREE_PATH/recovery/root/vendor/
        sudo umount vendor_mnt

    - name: Patch BoardConfig.mk (VINTF & Crypto)
      run: |
        TREE_PATH=$(find workspace -mindepth 2 -maxdepth 3 -type d | head -n 1)
        BOARD_CONFIG="$TREE_PATH/BoardConfig.mk"
        
        echo "Disabling VINTF Parsing..."
        sed -i 's/TARGET_USES_VINTF := true/TARGET_USES_VINTF := false/g' $BOARD_CONFIG
        
        echo "Adding hardware crypto libraries and metadata flags..."
        cat << 'EOF' >> $BOARD_CONFIG

        # FBE Decryption & Metadata
        BOARD_USES_METADATA_PARTITION := true
        TW_INCLUDE_CRYPTO := true
        TW_INCLUDE_CRYPTO_FBE := true
        TW_USE_FSCRYPT_POLICY := 2

        # Vendor Modules required for TEE/Keymaster
        TARGET_RECOVERY_DEVICE_MODULES += \
            libkeymaster4 \
            libkeymaster4_support \
            libkeymaster_messages \
            libhidltransport \
            libhwbinder \
            android.hardware.keymaster@4.0 \
            android.hardware.gatekeeper@1.0 \
            libkeystore-engine \
            libkeystore-wifi-hidl
        EOF

    - name: Patch recovery.fstab (F2FS Inlinecrypt)
      run: |
        TREE_PATH=$(find workspace -mindepth 2 -maxdepth 3 -type d | head -n 1)
        
        # Broaden search to catch either recovery.fstab or twrp.fstab
        FSTAB=$(find $TREE_PATH -name "recovery.fstab" -o -name "twrp.fstab" | head -n 1)
        
        if [ -n "$FSTAB" ]; then
          echo "Found fstab at $FSTAB. Patching /data encryption flags..."
          # Use a wildcard regex to catch and replace ANY existing fileencryption flag
          sed -i 's|fileencryption=[^, ]*|fileencryption=aes-256-xts:aes-256-cts:v2+inlinecrypt_optimized|g' "$FSTAB"
          
          echo "Verifying patch in build log..."
          grep "fileencryption" "$FSTAB" || echo "Note: No explicit fileencryption line found to patch."
        else
          echo "WARNING: No fstab file found in device tree!"
        fi

    - name: Commit and Push to Repository Root
      run: |
        TREE_PATH=$(find workspace -mindepth 2 -maxdepth 3 -type d | head -n 1)
        
        echo "Scrubbing repository root (keeping .git, .github, and working directories)..."
        find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'workspace' ! -name 'extracted' ! -name 'extracted_boot' ! -name 'unpack_bootimg.py' -exec rm -rf {} +
        
        echo "Moving generated files to the root of the repository..."
        cp -a $TREE_PATH/* ./
        
        echo "Cleaning up heavy intermediate files..."
        rm -rf workspace extracted extracted_boot payload-dumper-go unpack_bootimg.py
        
        echo "Configuring git and pushing changes..."
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add --all
        git commit -m "feat: Auto-generate clean device tree with kernel, dtbo, and patched fstab" || echo "No changes to commit"
        
        BRANCH=${GITHUB_REF#refs/heads/}
        
        echo "Syncing with remote branch $BRANCH..."
        git pull --rebase origin $BRANCH
        
        echo "Pushing device tree to repository..."
        git push origin HEAD:$BRANCH
        
