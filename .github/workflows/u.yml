name: Generate & Commit Device Tree to Root (beryl)

on:
  workflow_dispatch:
    inputs:
      ROM_URL:
        description: 'Direct URL to Stock Recovery/Fastboot ROM (.zip)'
        required: true
        default: 'https://share.google/oLrJd68V3BhwWwsi1'

permissions:
  contents: write

jobs:
  push-dt:
    name: Commit & Push Device Tree to Root
    runs-on: ubuntu-22.04
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: '8192'
        swap-size-mb: '1024'
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Aggressive Cleanup
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                    "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
        sudo apt-get clean
        docker system prune -af --volumes 2>/dev/null || true

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y aria2 unzip wget curl python3 python3-pip

    - name: Download & Extract Stock ROM Payload
      run: |
        ROM_URL="${{ inputs.ROM_URL }}"
        mkdir -p rom_extracted
        cd rom_extracted
        
        echo "Downloading stock ROM..."
        aria2c -c -x16 -s16 "$ROM_URL" -o rom.zip
        unzip -q rom.zip || true
        
        if [ -f "payload.bin" ]; then
          echo "Dumping partition images via payload-dumper-go..."
          wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.3.0/payload-dumper-go_1.3.0_linux_amd64.tar.gz
          tar -xzf payload-dumper-go_1.3.0_linux_amd64.tar.gz
          ./payload-dumper-go -o extracted_images payload.bin
        fi
        ls -la extracted_images/

    - name: Download Tree Archive, Patch Decryption, and Place in Root
      run: |
        echo "Downloading IQ-HARRY7 tree archive (branch khargosxh)..."
        wget -q https://github.com/IQ-HARRY7/android_device_xiaomi_beryl_2/archive/refs/heads/khargosxh.zip -O tree.zip
        unzip -q tree.zip
        
        if [ ! -d "android_device_xiaomi_beryl_2-khargosxh" ]; then
          echo "Error: Failed to extract tree archive!"
          exit 1
        fi
        
        # Clean current root files except git configs (.git, .github)
        find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +
        
        # Move tree contents directly to repository root
        cp -r android_device_xiaomi_beryl_2-khargosxh/* ./
        rm -rf android_device_xiaomi_beryl_2-khargosxh tree.zip
        
        EXTRACTED="rom_extracted/extracted_images"
        mkdir -p prebuilt
        
        # Inject raw hardware binaries
        [ -f "$EXTRACTED/boot.img" ] && cp "$EXTRACTED/boot.img" prebuilt/boot.img
        [ -f "$EXTRACTED/vendor_boot.img" ] && cp "$EXTRACTED/vendor_boot.img" prebuilt/vendor_boot.img
        [ -f "$EXTRACTED/dtbo.img" ] && cp "$EXTRACTED/dtbo.img" prebuilt/dtbo.img
        
        # Extract kernel binary if missing
        if [ ! -f "prebuilt/kernel" ] && [ -f "$EXTRACTED/boot.img" ]; then
          git clone https://github.com/cyberknight777/AIK-Linux.git aik || true
          if [ -d "aik" ]; then
            cp "$EXTRACTED/boot.img" aik/
            cd aik
            ./unpackbootimg.sh boot.img || true
            [ -f "split_img/boot.img-kernel" ] && cp split_img/boot.img-kernel "../prebuilt/kernel"
            cd ..
            rm -rf aik
          fi
        fi

        # Append decryption & FBE configuration flags to BoardConfig.mk
        echo "" >> BoardConfig.mk
        echo "# --- Custom OrangeFox Encryption & Decryption Flags ---" >> BoardConfig.mk
        echo "TW_INCLUDE_CRYPTO := true" >> BoardConfig.mk
        echo "TW_INCLUDE_CRYPTO_FBE := true" >> BoardConfig.mk
        echo "BOARD_USES_METADATA_PARTITION := true" >> BoardConfig.mk
        echo "TW_INCLUDE_XMLPARSER := true" >> BoardConfig.mk
        echo "TW_USE_TOOLBOX := true" >> BoardConfig.mk

    - name: Commit and Push Changes to Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "chore: update decrypted OrangeFox device tree for beryl from workflow" || echo "No changes to commit"
        git push origin HEAD
        
