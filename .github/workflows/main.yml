name: Build OrangeFox via IQ-HARRY7 Tree (beryl)

on:
  workflow_dispatch:
    inputs:
      ROM_URL:
        description: 'Direct URL to Stock Recovery/Fastboot ROM (.zip)'
        required: true
        default: 'https://share.google/oLrJd68V3BhwWwsi1'
      OFRP_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: 'fox_12.1'
        type: choice
        options:
        - 'fox_12.1'
        - 'fox_11.0'

permissions:
  contents: write

jobs:
  build-recovery:
    name: Build Recovery for beryl
    runs-on: ubuntu-22.04
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: '8192'
        swap-size-mb: '1024'
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Aggressive Cleanup
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                    "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
        sudo apt-get clean
        docker system prune -af --volumes 2>/dev/null || true

    - name: Install Build Dependencies & Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y aria2 ccache python3 python3-pip android-sdk-libsparse-utils unzip device-tree-compiler cpio repo wget liblz4-tool erofs-utils
        pip3 install --no-cache-dir protobuf

    - name: Download & Extract Stock ROM Payload
      run: |
        ROM_URL="${{ inputs.ROM_URL }}"
        mkdir -p ${GITHUB_WORKSPACE}/rom_extracted
        cd ${GITHUB_WORKSPACE}/rom_extracted
        
        echo "Downloading stock ROM..."
        aria2c -c -x16 -s16 "$ROM_URL" -o rom.zip
        unzip -q rom.zip || true
        
        if [ -f "payload.bin" ]; then
          echo "Dumping partition images via payload-dumper-go..."
          wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.3.0/payload-dumper-go_1.3.0_linux_amd64.tar.gz
          tar -xzf payload-dumper-go_1.3.0_linux_amd64.tar.gz
          ./payload-dumper-go -o extracted_images payload.bin
        fi
        ls -la extracted_images/

    - name: Initialize OrangeFox Workspace
      run: |
        OFRP_BRANCH="${{ inputs.OFRP_BRANCH }}"
        OFRP_BRANCH=${OFRP_BRANCH:-fox_12.1}
        
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox_sync
        cd ${GITHUB_WORKSPACE}/OrangeFox_sync
        git clone https://gitlab.com/OrangeFox/sync.git
        
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox_sync/sync
        ./orangefox_sync.sh --branch $OFRP_BRANCH --path${GITHUB_WORKSPACE}/OrangeFox

    - name: Clone External Device Tree & Inject Prebuilts
      run: |
        DEVICE_PATH="${GITHUB_WORKSPACE}/OrangeFox/device/xiaomi/beryl"
        mkdir -p "$DEVICE_PATH"
        
        echo "Cloning external device tree repository..."
        git clone https://github.com/IQ-HARRY7/android_device_xiaomi_beryl_2.git -b khargosxh temp_dt
        
        rm -rf "$DEVICE_PATH"/*
        cp -r temp_dt/* "$DEVICE_PATH"/
        
        EXTRACTED="${GITHUB_WORKSPACE}/rom_extracted/extracted_images"
        mkdir -p "$DEVICE_PATH/prebuilt"
        
        [ -f "$EXTRACTED/boot.img" ] && cp "$EXTRACTED/boot.img" "$DEVICE_PATH/prebuilt/boot.img"
        [ -f "$EXTRACTED/vendor_boot.img" ] && cp "$EXTRACTED/vendor_boot.img" "$DEVICE_PATH/prebuilt/vendor_boot.img"
        [ -f "$EXTRACTED/dtbo.img" ] && cp "$EXTRACTED/dtbo.img" "$DEVICE_PATH/prebuilt/dtbo.img"
        
        if [ ! -f "$DEVICE_PATH/prebuilt/kernel" ] && [ -f "$EXTRACTED/boot.img" ]; then
          echo "Extracting kernel binary from boot.img..."
          git clone https://github.com/cyberknight777/AIK-Linux.git aik || true
          if [ -d "aik" ]; then
            cp "$EXTRACTED/boot.img" aik/
            cd aik
            ./unpackbootimg.sh boot.img || true
            [ -f "split_img/boot.img-kernel" ] && cp split_img/boot.img-kernel "$DEVICE_PATH/prebuilt/kernel"
            cd ..
          fi
        fi

        echo "" >> "$DEVICE_PATH/BoardConfig.mk"
        echo "# Added Decryption & FBE Configuration Flags" >> "$DEVICE_PATH/BoardConfig.mk"
        echo "TW_INCLUDE_CRYPTO := true" >> "$DEVICE_PATH/BoardConfig.mk"
        echo "TW_INCLUDE_CRYPTO_FBE := true" >> "$DEVICE_PATH/BoardConfig.mk"
        echo "BOARD_USES_METADATA_PARTITION := true" >> "$DEVICE_PATH/BoardConfig.mk"
        echo "TW_INCLUDE_XMLPARSER := true" >> "$DEVICE_PATH/BoardConfig.mk"
        
        ls -la "$DEVICE_PATH/prebuilt/"

    - name: Build Recovery Image
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox
        
        set +e
        export USE_CCACHE=1
        export CCACHE_DIR=$(pwd)/.ccache
        mkdir -p $CCACHE_DIR
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 5G
        
        source build/envsetup.sh || . build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE="beryl"
        set -e
        
        lunch twrp_beryl-eng
        make clean
        mka adbd vendorbootimage recoveryimage

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(date +\%Y\%m\%d-\%H\%M)" >> $GITHUB_ENV

    - name: Upload Recovery Artifacts to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          OrangeFox/out/target/product/*/*.img
          OrangeFox/out/target/product/*/*.zip
        name: OrangeFox Recovery (IQ-HARRY7 Tree) - beryl // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}-harry-tree
        body: |
          ## OrangeFox Recovery Build for beryl
          * Built using external device tree: `IQ-HARRY7/android_device_xiaomi_beryl_2` (branch `khargosxh`)
          * Workflow dispatch trigger restored.
